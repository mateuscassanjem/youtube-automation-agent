services:
  agenttube:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./logs:/app/logs
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
